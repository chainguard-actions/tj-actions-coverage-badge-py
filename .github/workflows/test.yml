name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  test:
    name: Test coverage-badge-py
    runs-on: ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        platform: [ubuntu-latest, windows-latest, macos-latest, macos-11, windows-2022]
    steps:
      - name: Checkout
        uses: actions/checkout@a37ce9120846195fa4ece8f58b268e6043cb2f26 # v3
        with:
          persist-credentials: false
          fetch-depth: 0

      - uses: actions/setup-python@7f4fc3e22c37d6ff65e88745f38bd3157c663f7c # v4
        with:
          python-version: 3.9

      - name: Install dependencies
        run: |
          pip install --upgrade pip setuptools
          pip install coverage

      - name: Run coverage
        working-directory: test_package
        run: |
          coverage run -m unittest discover
          coverage report -m
 
      - name: Run coverage-badge-py
        uses: ./
        with:
          working-directory: test_package

      - name: Verify Changed files
        uses: tj-actions/verify-changed-files@7517b838f3a0d51de4b334a61ef1330672118927 # v14
        id: verify-changed-files
        with:
          files: test_package/coverage.svg

      - name: Commit README changes
        if: steps.verify-changed-files.outputs.files_changed == 'true'
        env:
          CHANGED_FILES: ${{ steps.verify-changed-files.outputs.changed_files }}
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add "$CHANGED_FILES"
          git commit -m "chore: update coverage badge."

      - name: Push changes
        if: steps.verify-changed-files.outputs.files_changed == 'true'
        uses: ad-m/github-push-action@881a6320fdb16eb5318c5054f31c218aec2b324c # master
        continue-on-error: true
        with:
          github_token: ${{ secrets.PAT_TOKEN }}
          branch: ${{ github.head_ref }}
